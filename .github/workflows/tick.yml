name: Schedule tick

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: schedule-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron/tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ] || [ -z "${APP_URL}" ]; then
            echo "::error::Repository secrets CRON_SECRET and APP_URL must be set"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/tick"
          echo
